<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#102f22" />
  <title>Fairway Greens — Mini Golf</title>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Realistic mini golf game"></canvas>
    <section class="hud" aria-label="Game information">
      <div class="brand"><span class="brand-mark">FG</span><div><strong>Fairway Greens</strong><small>MINI GOLF CLUB</small></div></div>
      <div class="score-panel">
        <div><small>HOLE</small><strong id="hole">01</strong></div>
        <div><small>PAR</small><strong id="par">3</strong></div>
        <div><small>STROKES</small><strong id="strokes">0</strong></div>
        <div><small>SCORE</small><strong id="score">E</strong></div>
      </div>
      <div class="wind"><span id="windArrow">↑</span><div><small>WIND</small><strong id="wind">6 mph</strong></div></div>
    </section>
    <aside class="shot-card">
      <div class="card-top"><span class="live-dot"></span><span id="lie">GREEN</span><span id="distance">22.4 yd</span></div>
      <h1 id="shotTitle">Read the green</h1>
      <p id="shotHint">Drag back from the ball, then release to putt.</p>
      <div class="meter"><div id="meterFill"></div><span>PUTT POWER</span></div>
    </aside>
    <div id="aimHint" class="aim-hint">DRAG TO AIM</div>
    <div class="controls">
      <button id="reset" title="Reset ball to tee">↺ <span>Reset</span></button>
      <button id="view" title="Toggle camera view">◉ <span>View</span></button>
      <button id="sound" title="Toggle sound">♬ <span>Sound</span></button>
    </div>
    <section id="finish" class="finish" aria-live="polite">
      <div class="finish-card"><span class="finish-kicker">HOLE COMPLETE</span><h2 id="finishTitle">Par!</h2><p id="finishText"></p><div class="finish-score"><span>STROKES</span><strong id="finishStrokes">3</strong></div><button id="next">Next Hole <span>→</span></button></div>
    </section>
    <div class="loading" id="loading"><div class="loader-ball"></div><strong>Fairway Greens</strong><span>Preparing the course</span></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
